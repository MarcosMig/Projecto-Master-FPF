<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: transparent;
        overflow: hidden;
      }
      .app {
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 14px;
        align-items: start;
      }
      .palette {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tool {
        height: 56px;
        border-radius: 14px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        user-select: none;
        font-size: 28px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }
      .tool:active {
        cursor: grabbing;
      }
      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 900 / 560;
        border-radius: 14px;
        overflow: hidden;
        background: #d4d4d8;
        border: 1px solid #cbd5e1;
      }
      .field {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
        user-select: none;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .piece {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: grab;
        touch-action: none;
      }
      .piece:active {
        cursor: grabbing;
      }
      .piece.selected {
        outline: 3px solid #22c55e;
        outline-offset: 2px;
      }
      .piece.jogador,
      .piece.jogador-b,
      .piece.bola {
        border-radius: 999px;
      }
      .piece.bola {
        background: #ffffff !important;
        border: 2px solid #111827;
      }
      .piece.cone {
        clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      }
      .piece.sinalizador {
        transform: translate(-50%, -50%) rotate(45deg);
      }
      .piece.baliza {
        background: rgba(255, 255, 255, 0.08) !important;
        border: 3px solid currentColor;
        border-radius: 4px;
      }
      .piece.texto {
        background: transparent !important;
        border: none;
        color: currentColor;
        font-size: 18px;
        font-weight: 700;
        min-width: 28px;
        min-height: 28px;
      }
      .piece.linha {
        background: transparent !important;
      }
      .piece.seta {
        background: transparent !important;
      }
      .line-body {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: currentColor;
      }
      .arrow-wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .arrow-shaft {
        position: absolute;
        left: 0;
        right: 12px;
        top: 50%;
        height: 4px;
        transform: translateY(-50%);
        border-radius: 999px;
        background: currentColor;
      }
      .arrow-head {
        position: absolute;
        right: 0;
        top: 50%;
        width: 0;
        height: 0;
        transform: translateY(-50%);
        border-top: 8px solid transparent;
        border-bottom: 8px solid transparent;
        border-left: 14px solid currentColor;
      }
      .label {
        position: absolute;
        top: 100%;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 600;
        color: #111827;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="palette" id="palette"></div>
      <div class="board" id="board">
        <img class="field" id="field" alt="field" />
        <div class="layer" id="layer"></div>
      </div>
    </div>

    <script>
      const Streamlit = {
        RENDER_EVENT: "streamlit:render",
        _renderHandler: null,
        setComponentReady() {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
            "*"
          );
        },
        setFrameHeight(height) {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: height || document.body.scrollHeight },
            "*"
          );
        },
        setComponentValue(value) {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: "streamlit:setComponentValue", value, dataType: "json" },
            "*"
          );
        },
        events: {
          addEventListener(type, handler) {
            if (type === "streamlit:render") {
              Streamlit._renderHandler = handler;
            }
          },
        },
      };

      const objectPaletteItems = [
        { type: "Jogador", symbol: "&#9679;", color: "#ef4444" },
        { type: "Jogador B", symbol: "&#9679;", color: "#2563eb" },
        { type: "Bola", symbol: "&#9711;", color: "#111827" },
        { type: "Cone", symbol: "&#9650;", color: "#f97316" },
        { type: "Sinalizador", symbol: "&#9670;", color: "#eab308" },
        { type: "Baliza", symbol: "&#9645;", color: "#ffffff" },
        { type: "Texto", symbol: "T", color: "#111827" },
      ];
      const shapePaletteItems = [
        { type: "Linha", symbol: "&#9473;", color: "#111827" },
        { type: "Seta", symbol: "&#8594;", color: "#111827" },
      ];

      let state = {
        objects: [],
        selected_id: null,
        activeColor: "#ef4444",
        activeSize: 18,
        activeLabel: "",
        exerciseId: "",
        objectsRevision: 0,
        paletteMode: "objects",
      };

      const paletteEl = document.getElementById("palette");
      const boardEl = document.getElementById("board");
      const fieldEl = document.getElementById("field");
      const layerEl = document.getElementById("layer");

      function uid() {
        return Math.random().toString(16).slice(2) + Date.now().toString(16);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function slugifyType(type) {
        return (type || "jogador").toLowerCase().replace(/\s+/g, "-");
      }

      function defaultColorFor(type) {
        const found = [...objectPaletteItems, ...shapePaletteItems].find((item) => item.type === type);
        return found ? found.color : "#ef4444";
      }

      function serializeObjects(objects) {
        return JSON.stringify(
          (objects || []).map((obj) => ({
            id: obj.id,
            type: obj.type,
            color: obj.color,
            size: Number(obj.size || 18),
            label: obj.label || "",
            x_pct: Number(obj.x_pct ?? 50),
            y_pct: Number(obj.y_pct ?? 50),
          }))
        );
      }

      function emit() {
        Streamlit.setComponentValue({
          objects: state.objects,
          selected_id: state.selected_id,
        });
      }

      function normalizeObject(obj) {
        const normalizedType = obj.type || obj.tipo || "Jogador";
        return {
          id: obj.id || obj.object_id || uid(),
          type: normalizedType,
          color: obj.color || obj.cor || defaultColorFor(normalizedType),
          size: Number(obj.size || obj.tamanho || 18),
          label: obj.label || obj.rotulo || "",
          x_pct: Number(obj.x_pct ?? 50),
          y_pct: Number(obj.y_pct ?? 50),
        };
      }

      function getPieceDimensions(type, size) {
        const baseSize = Number(size || 18);
        if (type === "Baliza") {
          return { width: baseSize * 3, height: baseSize * 1.5 };
        }
        if (type === "Sinalizador") {
          return { width: baseSize * 1.7, height: baseSize * 1.7 };
        }
        if (type === "Bola") {
          return { width: baseSize * 1.35, height: baseSize * 1.35 };
        }
        if (type === "Texto") {
          return { width: Math.max(baseSize * 2.6, 42), height: Math.max(baseSize * 1.2, 26) };
        }
        if (type === "Linha") {
          return { width: Math.max(baseSize * 4, 70), height: Math.max(baseSize * 0.8, 16) };
        }
        if (type === "Seta") {
          return { width: Math.max(baseSize * 4.4, 82), height: Math.max(baseSize * 1.1, 22) };
        }
        return { width: baseSize * 2, height: baseSize * 2 };
      }

      function boardPositionFromEvent(event) {
        const rect = boardEl.getBoundingClientRect();
        const x = clamp(((event.clientX - rect.left) / rect.width) * 100, 0, 100);
        const y = clamp(((event.clientY - rect.top) / rect.height) * 100, 0, 100);
        return { x_pct: Number(x.toFixed(2)), y_pct: Number(y.toFixed(2)) };
      }

      function getActivePalette() {
        return state.paletteMode === "shapes" ? shapePaletteItems : objectPaletteItems;
      }

      function renderPalette() {
        paletteEl.innerHTML = "";
        getActivePalette().forEach((item) => {
          const node = document.createElement("div");
          node.className = "tool";
          node.innerHTML = item.symbol;
          node.title = item.type;
          node.draggable = true;
          node.dataset.type = item.type;
          node.addEventListener("dragstart", (event) => {
            event.dataTransfer.setData("text/plain", item.type);
          });
          paletteEl.appendChild(node);
        });
      }

      function renderObjects() {
        layerEl.innerHTML = "";
        state.objects.forEach((obj) => {
          const node = document.createElement("div");
          const className = slugifyType(obj.type);
          const dims = getPieceDimensions(obj.type, obj.size);
          node.className = `piece ${className}${state.selected_id === obj.id ? " selected" : ""}`;
          node.dataset.id = obj.id;
          node.style.left = `${obj.x_pct}%`;
          node.style.top = `${obj.y_pct}%`;
          node.style.width = `${dims.width}px`;
          node.style.height = `${dims.height}px`;
          node.style.color = obj.color || defaultColorFor(obj.type);

          if (obj.type !== "Baliza") {
            node.style.background = obj.type === "Bola" ? "#ffffff" : (obj.color || defaultColorFor(obj.type));
          }
          if (obj.type === "Texto") {
            node.style.background = "transparent";
            node.textContent = obj.label || "T";
          }
          if (obj.type === "Linha") {
            const lineBody = document.createElement("div");
            lineBody.className = "line-body";
            node.appendChild(lineBody);
          }
          if (obj.type === "Seta") {
            const arrowWrap = document.createElement("div");
            arrowWrap.className = "arrow-wrap";
            const shaft = document.createElement("div");
            shaft.className = "arrow-shaft";
            const head = document.createElement("div");
            head.className = "arrow-head";
            arrowWrap.appendChild(shaft);
            arrowWrap.appendChild(head);
            node.appendChild(arrowWrap);
          }

          node.addEventListener("pointerdown", startMove);
          node.addEventListener("click", (event) => {
            event.stopPropagation();
            state.selected_id = obj.id;
            renderObjects();
          });

          if (obj.label && obj.type !== "Texto") {
            const label = document.createElement("div");
            label.className = "label";
            label.textContent = obj.label;
            node.appendChild(label);
          }

          layerEl.appendChild(node);
        });
      }

      function startMove(event) {
        event.preventDefault();
        event.stopPropagation();
        const node = event.currentTarget;
        const id = node.dataset.id;
        state.selected_id = id;

        function onMove(moveEvent) {
          const pos = boardPositionFromEvent(moveEvent);
          node.style.left = `${pos.x_pct}%`;
          node.style.top = `${pos.y_pct}%`;
          state.objects = state.objects.map((obj) => (obj.id === id ? { ...obj, ...pos } : obj));
        }

        function onUp(upEvent) {
          const finalPos = boardPositionFromEvent(upEvent);
          node.style.left = `${finalPos.x_pct}%`;
          node.style.top = `${finalPos.y_pct}%`;
          state.objects = state.objects.map((obj) => (obj.id === id ? { ...obj, ...finalPos } : obj));
          window.removeEventListener("pointermove", onMove);
          window.removeEventListener("pointerup", onUp);
          renderObjects();
          emit();
        }

        window.addEventListener("pointermove", onMove);
        window.addEventListener("pointerup", onUp);
      }

      boardEl.addEventListener("dragover", (event) => {
        event.preventDefault();
      });

      boardEl.addEventListener("drop", (event) => {
        event.preventDefault();
        const type = event.dataTransfer.getData("text/plain");
        if (!type) return;
        const pos = boardPositionFromEvent(event);
        const created = {
          id: uid(),
          type,
          color: state.activeColor || defaultColorFor(type),
          size: Number(state.activeSize || 18),
          label: state.activeLabel || (type === "Texto" ? "Texto" : ""),
          ...pos,
        };
        state.objects = [...state.objects, created];
        state.selected_id = created.id;
        renderObjects();
        emit();
      });

      boardEl.addEventListener("click", () => {
        state.selected_id = null;
        renderObjects();
      });

      function syncFromArgs(args) {
        state.activeColor = args.activeColor || "#ef4444";
        state.activeSize = Number(args.activeSize || 18);
        state.activeLabel = args.activeLabel || "";
        fieldEl.src = args.fieldImageUrl || "";
        state.paletteMode = args.paletteMode === "shapes" ? "shapes" : "objects";

        const incomingExerciseId = args.exerciseId || "";
        const incomingRevision = Number(args.objectsRevision || 0);
        const incoming = Array.isArray(args.objects) ? args.objects.map(normalizeObject) : [];
        const boardChanged = incomingExerciseId !== state.exerciseId;
        const revisionChanged = incomingRevision !== state.objectsRevision;

        state.exerciseId = incomingExerciseId;
        if (boardChanged || revisionChanged) {
          state.objectsRevision = incomingRevision;
          state.objects = incoming;
          if (!state.objects.some((obj) => obj.id === state.selected_id)) {
            state.selected_id = null;
          }
          renderObjects();
        }
        renderPalette();
      }

      function onRender(event) {
        const args = event.detail.args || {};
        syncFromArgs(args);
        Streamlit.setFrameHeight(Number(args.height || 620));
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "streamlit:render") return;
        if (Streamlit._renderHandler) {
          Streamlit._renderHandler({ detail: event.data });
        }
      });

      Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
      Streamlit.setComponentReady();
      renderPalette();
      renderObjects();
    </script>
  </body>
</html>
